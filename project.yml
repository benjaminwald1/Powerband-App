name: PowerBand
options:
  bundleIdPrefix: com.benjaminwald
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PowerBand:
    type: application
    platform: iOS
    sources:
      - path: PowerBand
    info:
      path: PowerBand/Info.plist
      properties:
        CFBundleDisplayName: PowerBand
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSBluetoothAlwaysUsageDescription: PowerBand uses Bluetooth to connect to your PowerBand sensor and sync your swings.
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [bluetooth-central]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjaminwald.powerband
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  PowerBandTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PowerBandTests
    dependencies:
      - target: PowerBand
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjaminwald.powerband.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PowerBand:
    build:
      targets:
        PowerBand: all
    test:
      targets:
        - PowerBandTests
